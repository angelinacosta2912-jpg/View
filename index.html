
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de autenticação</title>

<style>
:root {
  --preto: #090909;
  --painel: #141414;
  --vermelho: #b91c1c;
  --vermelho-claro: #ef4444;
  --texto: #f2f2f2;
  --cinza: #999;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(ellipse at top, #300909 0%, transparent 55%),
    var(--preto);
  color: var(--texto);
  font-family: Arial, sans-serif;
}

.card {
  width: 100%;
  max-width: 420px;
  padding: 32px;
  background: var(--painel);
  border: 1px solid #333;
  border-radius: 12px;
  box-shadow: 0 15px 50px #0008;
}

.linha {
  width: 55px;
  height: 4px;
  background: linear-gradient(
    to right, var(--vermelho), var(--vermelho-claro)
  );
  margin-bottom: 25px;
  border-radius: 5px;
}

.etapa {
  color: var(--vermelho-claro);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
}

h1 {
  font-size: 25px;
  margin: 12px 0;
}

.descricao {
  color: var(--cinza);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 28px;
}

label {
  display: block;
  font-size: 13px;
  margin-bottom: 9px;
}

input {
  width: 100%;
  padding: 14px;
  background: #090909;
  border: 1px solid #444;
  border-radius: 6px;
  color: white;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: var(--vermelho-claro);
}

input:disabled {
  opacity: .5;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  border: none;
  border-radius: 6px;
  background: var(--vermelho);
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

button:hover:not(:disabled) {
  background: var(--vermelho-claro);
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.mensagem {
  display: none;
  padding: 14px;
  margin-top: 20px;
  background: #280d0d;
  border: 1px solid #642525;
  border-left: 3px solid var(--vermelho-claro);
  border-radius: 5px;
  color: #f4dada;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.mensagem.visivel {
  display: block;
}

.mensagem strong {
  display: block;
  color: #ff6868;
  margin-bottom: 5px;
}

.mensagem.sucesso {
  background: #102015;
  border-color: #326340;
  border-left-color: #51bd70;
}

.mensagem.sucesso strong {
  color: #80d695;
}

.tentativas {
  margin-top: 22px;
}

.tentativas-topo {
  display: flex;
  justify-content: space-between;
  color: var(--cinza);
  font-size: 12px;
  margin-bottom: 10px;
}

.barras {
  display: flex;
  gap: 7px;
}

.barra {
  flex: 1;
  height: 6px;
  background: var(--vermelho-claro);
  border-radius: 5px;
}

.barra.usada {
  background: #414141;
}

.rodape {
  margin-top: 25px;
  text-align: center;
  color: #666;
  font-size: 11px;
}

.oculto {
  display: none !important;
}
</style>
</head>

<body>
<main class="card">
  <div class="linha"></div>

  <div class="etapa" id="etapa">Autenticação de acesso</div>
  <h1 id="titulo">Identificação do usuário</h1>
  <p class="descricao" id="descricao">
    Informe seu identificador para prosseguir.
  </p>

  <form id="formID">
    <label for="id">ID de acesso</label>
    <input
      id="id"
      type="text"
      maxlength="6"
      minlength="6"
      placeholder="Insira o ID"
      autocomplete="off"
      autocapitalize="characters"
      required
    >
    <button type="submit">Continuar</button>
  </form>

  <form id="formSenha" class="oculto">
    <label for="senha">Senha de acesso</label>
    <input
      id="senha"
      type="password"
      placeholder="Insira a senha"
      autocomplete="off"
      required
    >

    <div class="tentativas">
      <div class="tentativas-topo">
        <span>Tentativas restantes</span>
        <span id="contador">3 de 3</span>
      </div>

      <div class="barras">
        <div class="barra"></div>
        <div class="barra"></div>
        <div class="barra"></div>
      </div>
    </div>

    <button id="botaoSenha" type="submit">
      Autenticar
    </button>
  </form>

  <div id="mensagemID" class="mensagem" role="alert"></div>
  <div id="mensagemSenha" class="mensagem" role="alert"></div>

  <div class="rodape">
    Sistema de autenticação · Acesso restrito
  </div>
</main>

<script>
const IDS_BLOQUEADOS = [
  "A16L2B", // Davi Moraes
  "B67K61", // Eric Kalel
  "C22D4C"  // José Lisandre
];

const ID_AUTORIZADO = "J13BP7"; // Josefino
const SENHA = "Florzinha";

const formID = document.getElementById("formID");
const formSenha = document.getElementById("formSenha");
const campoID = document.getElementById("id");
const campoSenha = document.getElementById("senha");

const mensagemID = document.getElementById("mensagemID");
const mensagemSenha = document.getElementById("mensagemSenha");

const titulo = document.getElementById("titulo");
const descricao = document.getElementById("descricao");
const etapa = document.getElementById("etapa");

const contador = document.getElementById("contador");
const barras = [...document.querySelectorAll(".barra")];
const botaoSenha = document.getElementById("botaoSenha");

const CHAVE_TENTATIVAS = "portal_tentativas";
const CHAVE_BLOQUEIO = "portal_bloqueado";

let tentativas = Math.min(
  3,
  Math.max(0, Number(localStorage.getItem(CHAVE_TENTATIVAS)) || 0)
);

let bloqueado =
  localStorage.getItem(CHAVE_BLOQUEIO) === "sim" ||
  tentativas >= 3;

function mostrar(elemento, titulo, texto, sucesso = false) {
  elemento.className = "mensagem visivel";
  if (sucesso) elemento.classList.add("sucesso");

  const forte = document.createElement("strong");
  forte.textContent = titulo;

  const textoElemento = document.createElement("div");
  textoElemento.textContent = texto;

  elemento.replaceChildren(forte, textoElemento);
}

function limpar(elemento) {
  elemento.className = "mensagem";
  elemento.replaceChildren();
}

function atualizarTentativas() {
  const restantes = Math.max(0, 3 - tentativas);

  contador.textContent = `${restantes} de 3`;

  barras.forEach((barra, indice) => {
    barra.classList.toggle("usada", indice >= restantes);
  });

  if (tentativas >= 3) {
    bloqueado = true;
    localStorage.setItem(CHAVE_BLOQUEIO, "sim");

    campoSenha.disabled = true;
    botaoSenha.disabled = true;

    mostrar(
      mensagemSenha,
      "ACESSO BLOQUEADO",
      "O limite de tentativas de autenticação foi excedido. Um alerta de segurança foi encaminhado ao endereço de e-mail cadastrado."
    );
  }
}

// Se o bloqueio já existir neste navegador, mantém o acesso bloqueado.
if (bloqueado) {
  formID.classList.add("oculto");
  formSenha.classList.remove("oculto");

  titulo.textContent = "Acesso bloqueado";
  descricao.textContent =
    "O limite de tentativas de autenticação foi excedido.";
  etapa.textContent = "Verificação de segurança";

  atualizarTentativas();
}

formID.addEventListener("submit", function(event) {
  event.preventDefault();
  limpar(mensagemID);

  const id = campoID.value.trim().toUpperCase();

  if (!/^[A-Z0-9]{6}$/.test(id)) {
    mostrar(
      mensagemID,
      "ERRO DE AUTENTICAÇÃO",
      "O identificador informado não está registrado no sistema. Verifique os dados inseridos e tente novamente."
    );
    return;
  }

  if (IDS_BLOQUEADOS.includes(id)) {
    mostrar(
      mensagemID,
      "ERRO 721 — SESSÃO ATIVA",
      "Este usuário já possui uma sessão ativa em outro dispositivo. Encerre a sessão anterior e tente novamente."
    );
    return;
  }

  if (id !== ID_AUTORIZADO) {
    mostrar(
      mensagemID,
      "ERRO DE AUTENTICAÇÃO",
      "O identificador informado não está registrado no sistema. Verifique os dados inseridos e tente novamente."
    );
    return;
  }

  if (bloqueado) {
    atualizarTentativas();
    return;
  }

  formID.classList.add("oculto");
  formSenha.classList.remove("oculto");

  titulo.textContent = "Autenticação necessária";
  descricao.textContent = "Insira sua senha para continuar.";
  etapa.textContent = "Verificação de identidade";

  atualizarTentativas();
  campoSenha.focus();
});

formSenha.addEventListener("submit", function(event) {
  event.preventDefault();
  limpar(mensagemSenha);

  if (bloqueado || tentativas >= 3) {
    atualizarTentativas();
    return;
  }

  if (campoSenha.value === SENHA) {
    mostrar(
      mensagemSenha,
      "AUTENTICAÇÃO CONCLUÍDA",
      "Identidade validada. O próximo módulo ainda não está disponível.",
      true
    );

    campoSenha.disabled = true;
    botaoSenha.disabled = true;
    return;
  }

  tentativas++;

  localStorage.setItem(CHAVE_TENTATIVAS, String(tentativas));

  campoSenha.value = "";
  atualizarTentativas();

  if (!bloqueado) {
    mostrar(
      mensagemSenha,
      "SENHA INCORRETA",
      "A senha informada não confere. Verifique os dados e tente novamente."
    );
    campoSenha.focus();
  }
});
</script>
</body>
</html>
